    /*@T*/const T = {"s09a":[0.5,3.209,"Mas a célula não queima glicose sem parar."],"s09b":[3.559,6.503,"A fosfofrutocinase-1 funciona como uma válvula."],"s09c":[6.853,12.037,"Quando sobra ATP, ela fecha. Quando a energia acaba e o AMP aumenta, ela abre."],"s09d":[12.387,17.87,"No fígado, a insulina também abre essa válvula, por meio da frutose-2,6-bisfosfato."]}; const D = 18.67;/*@T-end*/

    const v = (t) => { for (let i = 1; i < V.length; i++) if (t <= V[i][0]) { const [a, va] = V[i - 1], [b, vb] = V[i]; return b === a ? vb : va + (vb - va) * (t - a) / (b - a); } return V[V.length - 1][1]; };
    const STEP = 1 / 120, P = [0];
    for (let i = 1; i <= Math.ceil(D / STEP) + 1; i++) P[i] = P[i - 1] + (v((i - 1) * STEP) + v(i * STEP)) / 2 * STEP;
    const pos = (t) => { const k = Math.min(P.length - 2, Math.max(0, Math.floor(t / STEP))); return P[k] + (P[k + 1] - P[k]) * (t / STEP - k); };

    const clock = { t: 0 };
