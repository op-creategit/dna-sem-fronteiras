    <div id="cap-0" class="cap-g"><span>Sabe aquela queimação nas pernas</span></div>
    <div id="cap-1" class="cap-g"><span>no fim de uma corrida?</span></div>
    <div id="cap-2" class="cap-g"><span>Ela começa com uma molécula</span></div>

    <div id="cap-5" class="cap-g"><span>Hoje vamos seguir essa glicose,</span></div>

    <div id="cap-7" class="cap-g"><span>pela primeira etapa do</span></div>
    <div id="cap-8" class="cap-g"><span>metabolismo energético: a glicólise.</span></div>
    <div id="cap-9" class="cap-g"><span>Glicólise quer dizer,</span></div>
    <div id="cap-10" class="cap-g"><span>literalmente, quebra do açúcar.</span></div>
    <div id="cap-11" class="cap-g"><span>Uma glicose, com seis carbonos,</span></div>
    <div id="cap-12" class="cap-g"><span>vira duas moléculas de piruvato,</span></div>
    <div id="cap-13" class="cap-g"><span>com três carbonos cada.</span></div>
    <div id="cap-14" class="cap-g"><span>São dez reações,</span></div>
    <div id="cap-15" class="cap-g"><span>e cada uma tem</span></div>
    <div id="cap-16" class="cap-g"><span>a sua enzima.</span></div>
    <div id="cap-17" class="cap-g"><span>Tudo isso acontece no citosol,</span></div>
    <div id="cap-18" class="cap-g"><span>o líquido que preenche a célula.</span></div>
    <div id="cap-19" class="cap-g"><span>E não precisa de oxigênio.</span></div>
    <div id="cap-20" class="cap-g"><span>Por isso a glicólise</span></div>
    <div id="cap-21" class="cap-g"><span>é tão antiga:</span></div>
    <div id="cap-22" class="cap-g"><span>ela existe em quase</span></div>
    <div id="cap-23" class="cap-g"><span>todos os seres vivos,</span></div>
    <div id="cap-24" class="cap-g"><span>das bactérias até nós.</span></div>
    <div id="cap-25" class="cap-g"><span>Pense na glicólise como</span></div>
    <div id="cap-26" class="cap-g"><span>um pequeno negócio.</span></div>
    <div id="cap-27" class="cap-g"><span>Primeiro você investe energia.</span></div>
    <div id="cap-28" class="cap-g"><span>Depois, colhe o lucro.</span></div>
    <div id="cap-29" class="cap-g"><span>E a moeda desse</span></div>
    <div id="cap-30" class="cap-g"><span>negócio é o ATP.</span></div>
    <div id="cap-31" class="cap-g"><span>Reação um: a hexocinase prende</span></div>
    <div id="cap-32" class="cap-g"><span>um fosfato na glicose,</span></div>
    <div id="cap-33" class="cap-g"><span>gastando o primeiro ATP.</span></div>
    <div id="cap-34" class="cap-g"><span>Ela vira glicose-6-fosfato e,</span></div>
    <div id="cap-35" class="cap-g"><span>com carga negativa,</span></div>
    <div id="cap-36" class="cap-g"><span>fica presa dentro da célula.</span></div>
    <div id="cap-37" class="cap-g"><span>Reação dois: uma isomerase reorganiza</span></div>
    <div id="cap-38" class="cap-g"><span>a molécula em frutose-6-fosfato.</span></div>
    <div id="cap-39" class="cap-g"><span>Reação três: a fosfofrutocinase-1 gasta o</span></div>
    <div id="cap-40" class="cap-g"><span>segundo ATP e forma frutose-1,6-bisfosfato.</span></div>
    <div id="cap-41" class="cap-g"><span>Esse é o passo decisivo:</span></div>
    <div id="cap-42" class="cap-g"><span>depois dele, não tem volta.</span></div>
    <div id="cap-43" class="cap-g"><span>Reação quatro: a aldolase corta</span></div>
    <div id="cap-44" class="cap-g"><span>a frutose ao meio.</span></div>
    <div id="cap-45" class="cap-g"><span>Saem dois açúcares de três carbonos:</span></div>
    <div id="cap-46" class="cap-g"><span>o gliceraldeído-3-fosfato e a di-hidroxiacetona-fosfato.</span></div>
    <div id="cap-47" class="cap-g"><span>Reação cinco: uma isomerase transforma</span></div>
    <div id="cap-48" class="cap-g"><span>o segundo no primeiro.</span></div>
    <div id="cap-49" class="cap-g"><span>Resultado: duas moléculas iguais.</span></div>
    <div id="cap-50" class="cap-g"><span>A partir daqui,</span></div>
    <div id="cap-51" class="cap-g"><span>tudo acontece em dobro.</span></div>
    <div id="cap-52" class="cap-g"><span>Reação seis: cada gliceraldeído-3-fosfato é oxidado.</span></div>
    <div id="cap-53" class="cap-g"><span>Os elétrons vão para o NAD⁺,</span></div>
    <div id="cap-54" class="cap-g"><span>que vira NADH,</span></div>
    <div id="cap-55" class="cap-g"><span>e entra mais um fosfato.</span></div>
    <div id="cap-56" class="cap-g"><span>Reação sete: esse fosfato</span></div>
    <div id="cap-57" class="cap-g"><span>passa para o ADP.</span></div>
    <div id="cap-58" class="cap-g"><span>Primeiro lucro: dois ATP.</span></div>
    <div id="cap-59" class="cap-g"><span>Isso se chama fosforilação</span></div>
    <div id="cap-60" class="cap-g"><span>em nível de substrato.</span></div>
    <div id="cap-61" class="cap-g"><span>Reações oito e nove:</span></div>
    <div id="cap-62" class="cap-g"><span>a molécula é rearranjada</span></div>
    <div id="cap-63" class="cap-g"><span>até virar fosfoenolpiruvato,</span></div>

    <div id="cap-79" class="cap-g"><span>e o AMP aumenta, ela abre.</span></div>

    <div id="cap-84" class="cap-g"><span>O destino dele depende do oxigênio.</span></div>

    <div id="cap-89" class="cap-g"><span>uma glicose rende cerca</span></div>
    <div id="cap-90" class="cap-g"><span>de trinta ATP.</span></div>
    <div id="cap-91" class="cap-g"><span>Sem oxigênio suficiente,</span></div>
    <div id="cap-92" class="cap-g"><span>o piruvato vira lactato no músculo,</span></div>
    <div id="cap-93" class="cap-g"><span>ou etanol e gás</span></div>
    <div id="cap-94" class="cap-g"><span>carbônico nas leveduras.</span></div>
    <div id="cap-95" class="cap-g"><span>Essa fermentação devolve o NAD⁺,</span></div>
    <div id="cap-96" class="cap-g"><span>e a glicólise continua.</span></div>
    <div id="cap-97" class="cap-g"><span>Então o lactato é o</span></div>
    <div id="cap-98" class="cap-g"><span>vilão da dor muscular?</span></div>
    <div id="cap-99" class="cap-g"><span>Não. A queimação durante o</span></div>
    <div id="cap-100" class="cap-g"><span>esforço está ligada ao acúmulo</span></div>
    <div id="cap-101" class="cap-g"><span>de íons hidrogênio.</span></div>
    <div id="cap-102" class="cap-g"><span>A dor dos dias seguintes</span></div>
    <div id="cap-103" class="cap-g"><span>vem de microlesões nas fibras.</span></div>
    <div id="cap-104" class="cap-g"><span>E o lactato é reaproveitado:</span></div>
    <div id="cap-105" class="cap-g"><span>o fígado o transforma</span></div>
    <div id="cap-106" class="cap-g"><span>de volta em glicose.</span></div>
    <div id="cap-107" class="cap-g"><span>É o ciclo de Cori.</span></div>
    <div id="cap-108" class="cap-g"><span>A glicólise também aparece na clínica.</span></div>
    <div id="cap-109" class="cap-g"><span>As hemácias não têm mitocôndrias:</span></div>

    <div id="cap-111" class="cap-g"><span>para ter energia.</span></div>
    <div id="cap-112" class="cap-g"><span>E muitas células de</span></div>
    <div id="cap-113" class="cap-g"><span>câncer aceleram a glicólise,</span></div>
    <div id="cap-114" class="cap-g"><span>mesmo com oxigênio.</span></div>
    <div id="cap-115" class="cap-g"><span>É o efeito Warburg.</span></div>
    <div id="cap-116" class="cap-g"><span>O exame PET usa uma</span></div>
    <div id="cap-117" class="cap-g"><span>glicose marcada para localizar esses</span></div>
